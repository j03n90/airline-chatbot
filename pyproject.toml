[project]
name = "airline-assistant"
version = "1.0.0"
description = "Airline policy and booking assistant with a mock test bench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.1.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "eval: conversation tests that call the chat API (need API_KEY)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
package = false
